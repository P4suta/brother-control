name: Checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux checks
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache_key: checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ~/.rustup/toolchains/nightly-2026-10-01-*
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'mise.toml', 'verification/**/Cargo.lock', 'verification/**/rust-toolchain.toml') }}
      - run: mise x -- just check

  native:
    name: Native adapters (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install: false
      - run: mise install rust@1.100.0 just@1.59.0 gitleaks@8.30.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}
      - run: mise x -- just native-check

  required:
    name: Required checks
    if: always()
    needs: [check, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - env:
          CHECK_RESULT: ${{ needs.check.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$NATIVE_RESULT" = success || test "$NATIVE_RESULT" = skipped
