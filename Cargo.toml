[workspace]
members = ["crates/core", "crates/brother-control", "xtask"]
exclude = [
  "verification/static-types",
  "verification/type-fixtures",
  "verification/compile-fail",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
brother-core = { path = "crates/core", version = "0.0.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
